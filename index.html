<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المصحف المسموع</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#292B27">
<link rel="icon" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Amiri Quran";src:url(fonts/amiri-quran-arabic-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Cairo;src:url(fonts/cairo-arabic-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Cairo;src:url(fonts/cairo-arabic-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
:root{--bg:#F2EEE5;--ink:#292B27;--muted:#66655E;--line:#DDD6C8;--panel:#FBF9F4;--verse:rgba(30,107,102,.08);--word:rgba(30,107,102,.22);--accent:#1E6B66;--on-accent:#ffffff;--band:#292B27;--band-ink:#F2EEE5;--band-field:#34362F;--band-line:#4A4B45}
@media (prefers-color-scheme:dark){:root{--bg:#1E1F1C;--ink:#ECE7DC;--muted:#A6A196;--line:#3A3B36;--panel:#252622;--verse:rgba(127,196,186,.08);--word:rgba(127,196,186,.28);--accent:#7FC4BA;--on-accent:#14201E;--band:#141513;--band-ink:#ECE7DC;--band-field:#2C2D29;--band-line:#4A4B45}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;padding:0}
header{position:sticky;top:0;z-index:5;background:var(--band);color:var(--band-ink);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
button{cursor:pointer}
select{flex:1;min-width:120px}
header select,header button{background:var(--band-field);color:var(--band-ink);border-color:var(--band-line)}
#play{background:var(--accent)!important;color:var(--on-accent)!important;border-color:var(--accent)!important;min-width:84px;font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:760px;margin:0 auto;padding:22px 18px calc(90px + env(safe-area-inset-bottom))}
#title{text-align:center;font-family:"Amiri Quran",serif;font-size:2rem;margin:6px 0 18px}
#text{font-family:"Amiri Quran",serif;font-size:clamp(1.7rem,5.2vw,2.35rem);line-height:2.3;text-align:justify;text-align-last:center}
.v{border-radius:10px;padding:2px 3px;cursor:pointer;transition:background .25s}
.v.on{background:var(--verse)}
.w{border-radius:6px;padding:0 2px;transition:background .12s}
.w.on{background:var(--word)}
.n{color:var(--accent);font-size:.8em;margin:0 4px;white-space:nowrap}
#msg{text-align:center;color:var(--muted);padding:40px 0}
footer{position:fixed;bottom:0;inset-inline:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
#bar{flex:1;accent-color:var(--accent)}
#time{color:var(--muted);font-size:.85rem;min-width:44px;direction:ltr}
#tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:0 0 14px}
#tools button{font-size:.85rem;padding:5px 10px}
#tools button{display:inline-flex;align-items:center;gap:6px;position:relative;overflow:hidden}
#tools button .ic,#tools button .lb{position:relative;z-index:1}
#tools button .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--word);transition:width .2s}
#prog{width:100%;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
#pbar{height:100%;width:0;background:var(--accent);transition:width .2s}
#st{width:100%;text-align:center;color:var(--muted);font-size:.85rem;min-height:1.4em}
.src{text-align:center;color:var(--muted);font-size:.85rem;line-height:2;margin-top:30px;border-top:1.5px solid var(--ink);padding-top:14px}
.src a{color:var(--accent)}
</style>
</head>
<body>
<script src="splash.js"></script>
<script src="quran-data.js"></script>
<header>
  <select id="surah" aria-label="السورة"></select>
  <select id="reciter" aria-label="القارئ">
    <option value="7">مشاري العفاسي</option>
    <option value="6">محمود الحصري</option>
    <option value="9">المنشاوي (مرتل)</option>
    <option value="2">عبد الباسط (مرتل)</option>
    <option value="3">السديس</option>
    <option value="10">الشريم</option>
    <option value="5">هاني الرفاعي</option>
  </select>
  <select id="speed" aria-label="السرعة" style="flex:0 0 76px;min-width:0">
    <option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option>
  </select>
  <button id="play" disabled>تشغيل</button>
</header>
<main>
  <div id="tools">
    <button id="dl" disabled><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 20h14"/></svg><span class="lb">تحميل التلاوة للاستخدام دون إنترنت</span></button>
    <button id="dlAll"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 20h14"/></svg><span class="lb">تحميل كل السور</span></button>
    <div id="prog" hidden><div id="pbar"></div></div>
    <span id="st" role="status"></span>
  </div>
  <div id="title"></div>
  <div id="text"><div id="msg">جارٍ التحميل…</div></div>
  <p class="src">النص: <a href="https://quranenc.com" target="_blank" rel="noopener">موسوعة القرآن الكريم</a> (مضمَّن في التطبيق) · الصوت والتوقيت: <a href="https://quran.com" target="_blank" rel="noopener">Quran.com</a> (عند التحميل) · الخط: Amiri Quran وCairo (مضمَّنان)<br>
  <a href="/privacy.html">سياسة الخصوصية</a> · <a href="/terms.html">اتفاقية الاستخدام</a><br>
  شكر وتقدير للمصدر والمطوّر: <a href="https://www.atrakchi.com/" target="_blank" rel="noopener">داود الاطرقجي للاستشارات الهندسية</a> — <a href="mailto:info@atrakchi.com">info@atrakchi.com</a></p>
</main>
<footer>
  <span id="time">0:00</span>
  <input id="bar" type="range" min="0" max="1000" value="0" aria-label="موضع التلاوة">
</footer>
<audio id="audio" preload="auto"></audio>

<script>
const API = "https://api.quran.com/api/v4";
const $ = id => document.getElementById(id);
const audio = $("audio");
const NAMES = window.QURAN.n, TEXT = window.QURAN.v;
let verses = [], stamps = [], curV = null, curW = null, raf = 0, objUrl = null, loadId = 0, busy = false, stopAll = false;

const toAr = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const fmt = s => Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2, "0");
const mb = b => toAr((b/1048576).toFixed(b > 10485760 ? 0 : 1));
const BTN = {dl: "تحميل التلاوة للاستخدام دون إنترنت", all: "تحميل كل السور"};
function setBtn(id, label, pct){
  const b = $(id); b.querySelector(".lb").textContent = label;
  let f = b.querySelector(".fill");
  if(pct == null){ if(f) f.remove(); return; }
  if(!f){ f = document.createElement("span"); f.className = "fill"; b.prepend(f); }
  f.style.width = pct + "%";
}
function prog(p){ const el = $("prog"); el.hidden = p == null; if(p != null) $("pbar").style.width = p + "%"; }
const say = t => { $("st").textContent = t || ""; };

/* ---------- التخزين المحلي للتلاوات (IndexedDB) ---------- */
const DB = {
  open(){ return this._p || (this._p = new Promise((res, rej) => {
    const r = indexedDB.open("quran-offline", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("a");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  })); },
  async run(mode, fn){
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction("a", mode); const rq = fn(t.objectStore("a"));
      t.oncomplete = () => res(rq && rq.result); t.onerror = t.onabort = () => rej(t.error);
    });
  },
  get(k){ return this.run("readonly", s => s.get(k)); },
  set(k, v){ return this.run("readwrite", s => s.put(v, k)); },
  del(k){ return this.run("readwrite", s => s.delete(k)); },
  keys(){ return this.run("readonly", s => s.getAllKeys()); }
};
const keyOf = (rec, s) => rec + ":" + s;

/* ---------- الشبكة (اختيارية: للتحميل فقط) ---------- */
async function api(path){
  const r = await fetch(API + path);
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
async function getRecitation(rec, s){
  const a = await api(`/chapter_recitations/${rec}/${s}?segments=true`);
  let url = a.audio_file.audio_url;
  if(!/^https?:/.test(url)) url = "https://verses.quran.com/" + url.replace(/^\/+/, "");
  return { url, stamps: a.audio_file.timestamps || [] };
}
async function fetchBlob(url, onProg){
  const r = await fetch(url);
  if(!r.ok) throw new Error(r.status);
  const total = +r.headers.get("content-length") || 0;
  if(!r.body || !total){ return r.blob(); }
  const rd = r.body.getReader(), parts = []; let got = 0;
  for(;;){
    const {done, value} = await rd.read();
    if(done) break;
    parts.push(value); got += value.length;
    if(onProg) onProg(got / total, got);
  }
  return new Blob(parts, {type: r.headers.get("content-type") || "audio/mpeg"});
}
async function saveSurah(rec, s, onProg){
  const {url, stamps: st} = await getRecitation(rec, s);
  const blob = await fetchBlob(url, onProg);
  await DB.set(keyOf(rec, s), {blob, stamps: st});
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
}

/* ---------- الواجهة ---------- */
function init(){
  $("surah").innerHTML = NAMES.map((n, i) => `<option value="${i+1}">${toAr(i+1)}. ${n}</option>`).join("");
  try{
    const saved = localStorage.getItem("surah"); if(saved) $("surah").value = saved;
    const r = localStorage.getItem("reciter"); if(r) $("reciter").value = r;
  }catch(e){}
  load();
}

async function marks(){
  let keys = [];
  try{ keys = await DB.keys(); }catch(e){}
  const rec = $("reciter").value, have = new Set(keys.filter(k => k.startsWith(rec + ":")).map(k => k.split(":")[1]));
  [...$("surah").options].forEach((o, i) => { o.textContent = `${toAr(i+1)}. ${NAMES[i]}${have.has(String(i+1)) ? "  ✓" : ""}`; });
  return have;
}

async function load(){
  const id = ++loadId;
  audio.pause(); cancelAnimationFrame(raf); clearOn();
  if(objUrl){ URL.revokeObjectURL(objUrl); objUrl = null; }
  audio.removeAttribute("src"); stamps = [];
  $("play").disabled = true; $("play").textContent = "تشغيل";
  const s = $("surah").value, rec = $("reciter").value;
  try{ localStorage.setItem("surah", s); localStorage.setItem("reciter", rec); }catch(e){}

  verses = TEXT[s-1];
  render();
  $("title").textContent = "سورة " + NAMES[s-1];
  scrollTo(0, 0);
  say("");

  let saved = null;
  try{ saved = await DB.get(keyOf(rec, s)); }catch(e){}
  if(id !== loadId) return;
  const have = await marks(); if(id !== loadId) return;
  $("dl").disabled = busy;
  setBtn("dl", saved ? "التلاوة محمّلة ✓ (اضغط للحذف)" : BTN.dl);

  if(saved){
    stamps = saved.stamps;
    objUrl = URL.createObjectURL(saved.blob);
    audio.src = objUrl; audio.playbackRate = +$("speed").value;
    $("play").disabled = false;
  }else if(navigator.onLine){
    try{
      const r = await getRecitation(rec, s);
      if(id !== loadId) return;
      stamps = r.stamps; audio.src = r.url; audio.playbackRate = +$("speed").value;
      $("play").disabled = false;
    }catch(e){ if(id === loadId) say("تعذّر تحميل التلاوة. جرّب قارئًا آخر."); }
  }else{
    say("لا يوجد اتصال. النص متاح للقراءة، أما التلاوة فتحتاج إلى تحميل مسبق (السور المحمّلة عليها علامة ✓).");
  }
}

function render(){
  $("text").innerHTML = verses.map((t, i) => {
    const n = i + 1;
    const ws = t.split(" ").map((w, j) => `<span class="w" data-p="${j+1}">${w}</span>`).join(" ");
    return `<span class="v" data-k="${$("surah").value}:${n}">${ws} <span class="n">﴿${toAr(n)}﴾</span></span> `;
  }).join("");
  curV = curW = null;
}

function clearOn(){
  if(curV) curV.classList.remove("on");
  if(curW) curW.classList.remove("on");
  curV = curW = null;
}

function tick(){
  const t = audio.currentTime * 1000;
  $("time").textContent = fmt(audio.currentTime);
  if(audio.duration) $("bar").value = audio.currentTime / audio.duration * 1000;
  const st = stamps.find(x => t >= x.timestamp_from && t < x.timestamp_to);
  if(st){
    const vEl = document.querySelector(`.v[data-k="${st.verse_key}"]`);
    if(vEl !== curV){
      if(curV) curV.classList.remove("on");
      curV = vEl;
      if(vEl){
        vEl.classList.add("on");
        const r = vEl.getBoundingClientRect();
        if(r.top < 120 || r.bottom > innerHeight - 90) vEl.scrollIntoView({block:"center", behavior:"smooth"});
      }
    }
    let pos = null;
    for(const sg of (st.segments || [])){
      const n = sg.length;
      if(t >= sg[n-2] && t < sg[n-1]){ pos = n === 3 ? sg[0] : sg[1]; break; }
    }
    const wEl = pos && vEl ? vEl.querySelector(`.w[data-p="${pos}"]`) : null;
    if(wEl !== curW){
      if(curW) curW.classList.remove("on");
      curW = wEl;
      if(wEl) wEl.classList.add("on");
    }
  }
  if(!audio.paused) raf = requestAnimationFrame(tick);
}

/* ---------- أزرار التحميل ---------- */
$("dl").onclick = async () => {
  if(busy) return;
  const s = $("surah").value, rec = $("reciter").value;
  let saved = null; try{ saved = await DB.get(keyOf(rec, s)); }catch(e){}
  if(saved){
    if(confirm("حذف التلاوة المحمّلة لهذه السورة من الجهاز؟")){ await DB.del(keyOf(rec, s)); load(); }
    return;
  }
  if(!navigator.onLine){ say("يلزم اتصال بالإنترنت لتحميل التلاوة."); return; }
  busy = true; $("dl").disabled = true; $("dlAll").disabled = true;
  try{
    await saveSurah(rec, s, (p, got) => { const n = Math.round(p*100); setBtn("dl", toAr(n) + "٪", n); prog(n); say("جارٍ التحميل… " + toAr(n) + "٪ (" + mb(got) + " م.ب)"); });
    prog(null);
    say("تم التحميل. التلاوة متاحة الآن دون إنترنت.");
    if(audio.paused && $("surah").value === s && $("reciter").value === rec) await load();
  }catch(e){ prog(null); say("تعذّر التحميل. تحقق من الاتصال وحاول مرة أخرى."); }
  busy = false; $("dl").disabled = false; $("dlAll").disabled = false;
  setBtn("dl", BTN.dl);
};

$("dlAll").onclick = async () => {
  if(busy){ stopAll = true; say("جارٍ الإيقاف بعد السورة الحالية…"); return; }
  if(!navigator.onLine){ say("يلزم اتصال بالإنترنت للتحميل."); return; }
  if(!confirm("سيتم تحميل جميع سور هذا القارئ إلى جهازك. الحجم تقديري يتراوح بين ٣٠٠ و٧٠٠ ميغابايت تقريبًا بحسب القارئ، ويُفضَّل استخدام شبكة Wi-Fi. المتابعة؟")) return;
  const rec = $("reciter").value;
  busy = true; stopAll = false; $("dl").disabled = true; setBtn("dlAll", "إيقاف التحميل", 0);
  let have = new Set(); try{ have = new Set((await DB.keys()).filter(k => k.startsWith(rec + ":"))); }catch(e){}
  let failed = false, total = 0, done = have.size;
  for(let s = 1; s <= 114 && !stopAll; s++){
    if(have.has(keyOf(rec, s))) continue;
    try{
      let last = 0;
      await saveSurah(rec, s, (p, got) => {
        last = got;
        const n = Math.min(100, Math.round((done + p) / 114 * 100));
        setBtn("dlAll", "إيقاف التحميل — " + toAr(n) + "٪", n); prog(n);
        say(`سورة ${NAMES[s-1]} — ${toAr(done + 1)}/١١٤ — ${toAr(n)}٪ — ${mb(total + got)} م.ب`);
      });
      total += last; done++;
    }catch(e){ failed = true; break; }
  }
  busy = false; $("dl").disabled = false; setBtn("dlAll", BTN.all); prog(null);
  say(failed ? "توقّف التحميل (تعذّر الاتصال). السور المحمّلة محفوظة، ويمكنك المتابعة لاحقًا." : stopAll ? "تم الإيقاف. السور المحمّلة محفوظة." : "اكتمل تحميل جميع السور.");
  if(audio.paused) load(); else marks();
};

$("play").onclick = () => audio.paused ? audio.play() : audio.pause();
audio.onplay = () => { $("play").textContent = "إيقاف"; raf = requestAnimationFrame(tick); };
audio.onpause = () => { $("play").textContent = "تشغيل"; };
audio.onended = () => { $("play").textContent = "تشغيل"; clearOn(); };
audio.onseeked = tick;
$("bar").oninput = e => { if(audio.duration){ audio.currentTime = e.target.value / 1000 * audio.duration; tick(); } };
$("speed").onchange = e => audio.playbackRate = +e.target.value;
$("surah").onchange = load;
$("reciter").onchange = load;
$("text").onclick = e => {
  const v = e.target.closest(".v");
  if(!v || $("play").disabled) return;
  const st = stamps.find(x => x.verse_key === v.dataset.k);
  if(st){ audio.currentTime = st.timestamp_from / 1000; audio.play(); }
};

if("serviceWorker" in navigator){ addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
addEventListener("online", () => { if(!busy && audio.paused) load(); });
init();
</script>
</body>
</html>
